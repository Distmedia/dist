intro: |-
  Vi är journalister, ljuddesigners & producenter som drivs av smarta, modiga, roliga, berörande och oväntade berättelser. Kom till oss i Gamla stan i Stockholm om du har en bra historia, eller vill samarbeta med oss. [info@dist.se](mailto:info@dist.se)
people:
  - name: Vendela Lundberg
    avatar_red: /media/vendela-lundberg_red.jpg
    avatar_green: /media/vendela-lundberg_green.jpg
    avatar_blue: /media/vendela-lundberg_blue.jpg
    avatar_purple: /media/vendela-lundberg_purple.jpg
    info: |-
      vendela@dist.se\
      +46 705604846

      Vendela Lundberg har tagit fram populära format som P3 Musikdokumentär och P3 ID, som hon idag också producerar och programleder. Hon hörs också med jämna mellanrum i radio och är återkommande kolumnist i Dagens Nyheter. Vendela är utbildad vid Stockholms Konstnärliga Högskola.
  - name: Carl-Johan Ulvenäs
    avatar_red: /media/carl-johan-ulvenas_red.jpg
    avatar_green: /media/carl-johan-ulvenas_green.jpg
    avatar_blue: /media/carl-johan-ulvenas_blue.jpg
    avatar_purple: /media/carl-johan-ulvenas_purple.jpg
    info: |-
      cj@dist.se\
      +46 763067717

      Carl-Johan Ulvenäs har tidigare varit med och tagit fram den populära och prisvinnande podden Gräns för Sveriges Radio och arbetat som producent på P3. Carl-Johan medverkar återkommande i radio och är utbildad vid journalisthögskolan JMK i Stockholm.
  - name: Sally Henriksson
    avatar_red: /media/sally-henriksson_red.jpg
    avatar_green: /media/sally-henriksson_green.jpg
    avatar_blue: /media/sally-henriksson_blue.jpg
    avatar_purple: /media/sally-henriksson_purple.jpg
    info: |-
      sally@dist.se\
      +46 702236122

      Sally Henriksson har arbetat med några av Sveriges Radios mest prestigefyllda program som Konflikt, Godmorgon världen och Studio Ett, samt produktioner för bla P2, P4 och PodMe. Sally föreläser och handleder journaliststudenter, och är utbildad vid Södertörns högskola och Stockholms Konstnärliga Högskola.
